name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build/typecheck/tests don't connect to a DB, but the modules that read
      # these guard on their presence, so provide safe placeholders.
      DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
      AUTH_SECRET: "ci-placeholder-secret-not-used-for-real-auth"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build
