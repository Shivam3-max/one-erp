name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      # Build/typecheck/tests don't connect to a DB, but the modules that read
      # these guard on their presence, so provide safe placeholders.
      DATABASE_URL: "mysql://ci:ci@localhost:3306/ci"
      AUTH_SECRET: "ci-placeholder-secret-not-used-for-real-auth"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Unit tests
        run: npm test

      - name: Build
        run: npm run build

  e2e:
    runs-on: ubuntu-latest
    env:
      # `next dev` falls back to in-memory mock data when MySQL is unreachable;
      # the short connect timeout makes that fallback fast and deterministic.
      DATABASE_URL: "mysql://ci:ci@localhost:3306/ci?connect_timeout=2&pool_timeout=2&connection_limit=1"
      AUTH_SECRET: "ci-placeholder-secret-not-used-for-real-auth"
      SIGNIN_RATE_MAX: "1000"
      REGISTER_RATE_MAX: "1000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E tests
        run: npm run test:e2e

      - name: Upload Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
